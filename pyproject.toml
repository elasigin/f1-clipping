[project]
name = "f1-clipping"
version = "0.1.0"
description = "Data pipeline for 'Visualizing Energy Clipping in Formula 1's 2026 Cars' (Stanford CS448B)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
